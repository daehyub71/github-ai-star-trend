<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="diagram-size" content="1720x720">
<title>주간 실행 흐름</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; }
  text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif; fill: #1b1a17; }
  .code { font-family: Consolas, 'SF Mono', Menlo, monospace; }
  .muted { fill: #5f5b53; }
  .title { font-size: 22px; font-weight: 700; }
  .sub { font-size: 13px; }
  .stage { fill: #eef3fb; stroke: #2f5d9e; stroke-width: 1.5; }
  .stage-llm { fill: #fdf1e6; stroke: #c46a12; stroke-width: 1.5; }
  .name { font-size: 15px; font-weight: 700; }
  .role { font-size: 14px; font-weight: 700; }
  .detail { font-size: 12px; }
  .arrow { stroke: #5f5b53; stroke-width: 1.6; fill: none; }
  .data-line { stroke: #2e7d4f; stroke-width: 2; fill: none; }
  .ext-line { stroke: #5b4a9e; stroke-width: 1.8; fill: none; }
  .work { fill: none; stroke: #8a8f98; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .work-line { stroke: #8a8f98; stroke-width: 1.2; stroke-dasharray: 4 3; }
</style>
</head>
<body>
<svg width="1720" height="720" viewBox="0 0 1720 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5b53"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4a9e"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="40" y="44" class="title">주간 실행 흐름</text>
  <text x="40" y="68" class="sub muted">SPEC §4-1 · PLAN 1-1 — GitHub Actions 가 매주 Python 파이프라인을 돌린다. Vercel 은 정본 데이터로 비공개 사이트를 만들고, Notion 은 검토용 페이지를 받는다</text>

  <!-- Actions 컨테이너 -->
  <rect x="30" y="92" width="1660" height="290" rx="14" fill="#f7f8fa" stroke="#c9ced6" stroke-width="1.2"/>
  <text x="50" y="119" style="font-size:14px;font-weight:700">GitHub Actions 주간 크론</text>
  <text x="232" y="119" class="detail muted">Python · 첫 단계로 API 계약 점검(<tspan class="code">contract</tspan>) — 형식이 바뀌었으면 아무것도 쓰지 않고 멈춘다 · 단계마다 산출물을 파일로 남겨 실패한 단계부터 다시 돌린다</text>

  <!-- 단계 상자: x = 52 + 146·i, 폭 128 -->
  <g>
    <rect x="52" y="140" width="128" height="96" rx="10" class="stage"/>
    <text x="116" y="173" text-anchor="middle" class="name code">discover</text>
    <text x="116" y="196" text-anchor="middle" class="role">후보 발굴</text>
    <text x="116" y="215" text-anchor="middle" class="detail muted">≥1,000 전체 스냅샷</text>
    <text x="116" y="230" text-anchor="middle" class="detail muted">+ 새 저장소 30일</text>

    <rect x="198" y="140" width="128" height="96" rx="10" class="stage"/>
    <text x="262" y="173" text-anchor="middle" class="name code">stars</text>
    <text x="262" y="196" text-anchor="middle" class="role">스타 시계열</text>
    <text x="262" y="215" text-anchor="middle" class="detail muted">스냅샷 차이 →</text>
    <text x="262" y="230" text-anchor="middle" class="detail muted">상위만 히스토리 API</text>

    <rect x="344" y="140" width="128" height="96" rx="10" class="stage-llm"/>
    <text x="408" y="173" text-anchor="middle" class="name code">classify</text>
    <text x="408" y="196" text-anchor="middle" class="role">분류</text>
    <text x="408" y="215" text-anchor="middle" class="detail muted">AI 여부 · 유형</text>
    <text x="408" y="230" text-anchor="middle" class="detail muted">· 카테고리</text>

    <rect x="490" y="140" width="128" height="96" rx="10" class="stage"/>
    <text x="554" y="173" text-anchor="middle" class="name code">rank</text>
    <text x="554" y="196" text-anchor="middle" class="role">랭킹</text>
    <text x="554" y="215" text-anchor="middle" class="detail muted">4축 × 2탭</text>
    <text x="554" y="230" text-anchor="middle" class="detail muted">가짜 스타 의심 표시</text>

    <rect x="636" y="140" width="128" height="96" rx="10" class="stage"/>
    <text x="700" y="173" text-anchor="middle" class="name code">evidence</text>
    <text x="700" y="196" text-anchor="middle" class="role">근거 수집</text>
    <text x="700" y="215" text-anchor="middle" class="detail muted">GitHub · HN · Reddit</text>
    <text x="700" y="230" text-anchor="middle" class="detail muted">웹 · 패키지 · 국내</text>

    <rect x="782" y="140" width="128" height="96" rx="10" class="stage-llm"/>
    <text x="846" y="173" text-anchor="middle" class="name code">analyze</text>
    <text x="846" y="196" text-anchor="middle" class="role">심층 카드</text>
    <text x="846" y="215" text-anchor="middle" class="detail muted">신규: 8개 섹션</text>
    <text x="846" y="230" text-anchor="middle" class="detail muted">재등장: 변경분만</text>

    <rect x="928" y="140" width="128" height="96" rx="10" class="stage-llm"/>
    <text x="992" y="173" text-anchor="middle" class="name code">brief</text>
    <text x="992" y="196" text-anchor="middle" class="role">주간 브리핑</text>
    <text x="992" y="215" text-anchor="middle" class="detail muted">카테고리 흐름</text>
    <text x="992" y="230" text-anchor="middle" class="detail muted">· 시사점</text>

    <rect x="1074" y="140" width="128" height="96" rx="10" class="stage-llm"/>
    <text x="1138" y="173" text-anchor="middle" class="name code">blog</text>
    <text x="1138" y="196" text-anchor="middle" class="role">블로그 초안</text>
    <text x="1138" y="215" text-anchor="middle" class="detail muted">주간 1편</text>
    <text x="1138" y="230" text-anchor="middle" class="detail muted">브리핑 + 주목 2~3개</text>

    <rect x="1220" y="140" width="128" height="96" rx="10" class="stage"/>
    <text x="1284" y="173" text-anchor="middle" class="name code">export</text>
    <text x="1284" y="196" text-anchor="middle" class="role">파생 데이터</text>
    <text x="1284" y="215" text-anchor="middle" class="detail muted">화면에 필요한</text>
    <text x="1284" y="230" text-anchor="middle" class="detail muted">만큼만 집계</text>

    <rect x="1366" y="140" width="128" height="96" rx="10" class="stage"/>
    <text x="1430" y="173" text-anchor="middle" class="name code">notion</text>
    <text x="1430" y="196" text-anchor="middle" class="role">Notion 저장</text>
    <text x="1430" y="215" text-anchor="middle" class="detail muted">주간 · 카드 · 블로그</text>
    <text x="1430" y="230" text-anchor="middle" class="detail muted">"초안"만 고친다</text>

    <rect x="1512" y="140" width="128" height="96" rx="10" class="stage"/>
    <text x="1576" y="173" text-anchor="middle" class="name code">archive</text>
    <text x="1576" y="196" text-anchor="middle" class="role">보관</text>
    <text x="1576" y="215" text-anchor="middle" class="detail muted">근거 원문 +</text>
    <text x="1576" y="230" text-anchor="middle" class="detail muted">LLM 로그 압축</text>
  </g>

  <!-- LLM 배지 (상자 윗변에 걸친다) -->
  <g>
    <rect x="428" y="131" width="38" height="18" rx="9" fill="#c46a12"/>
    <text x="447" y="144.5" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#fff">LLM</text>
    <rect x="866" y="131" width="38" height="18" rx="9" fill="#c46a12"/>
    <text x="885" y="144.5" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#fff">LLM</text>
    <rect x="1012" y="131" width="38" height="18" rx="9" fill="#c46a12"/>
    <text x="1031" y="144.5" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#fff">LLM</text>
    <rect x="1158" y="131" width="38" height="18" rx="9" fill="#c46a12"/>
    <text x="1177" y="144.5" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#fff">LLM</text>
  </g>

  <!-- 단계 사이 화살표 -->
  <g>
    <path d="M180 188 H196" class="arrow" marker-end="url(#arr)"/>
    <path d="M326 188 H342" class="arrow" marker-end="url(#arr)"/>
    <path d="M472 188 H488" class="arrow" marker-end="url(#arr)"/>
    <path d="M618 188 H634" class="arrow" marker-end="url(#arr)"/>
    <path d="M764 188 H780" class="arrow" marker-end="url(#arr)"/>
    <path d="M910 188 H926" class="arrow" marker-end="url(#arr)"/>
    <path d="M1056 188 H1072" class="arrow" marker-end="url(#arr)"/>
    <path d="M1202 188 H1218" class="arrow" marker-end="url(#arr)"/>
    <path d="M1348 188 H1364" class="arrow" marker-end="url(#arr)"/>
    <path d="M1494 188 H1510" class="arrow" marker-end="url(#arr)"/>
  </g>

  <!-- 작업 파일 (.work/, 실행마다 지워짐) -->
  <g>
    <line x1="116" y1="236" x2="116" y2="262" class="work-line"/>
    <rect x="56" y="262" width="120" height="40" rx="8" class="work"/>
    <text x="116" y="280" text-anchor="middle" class="detail code muted">.work/</text>
    <text x="116" y="295" text-anchor="middle" class="detail muted">후보 · 스냅샷</text>

    <line x1="700" y1="236" x2="700" y2="262" class="work-line"/>
    <rect x="640" y="262" width="120" height="40" rx="8" class="work"/>
    <text x="700" y="280" text-anchor="middle" class="detail code muted">.work/raw/</text>
    <text x="700" y="295" text-anchor="middle" class="detail muted">근거 원문</text>
  </g>

  <!-- 인용 게이트 — 카드 · 브리핑 · 블로그 초안이 모두 지난다 -->
  <g>
    <path d="M846 236 L862 260" class="arrow" marker-end="url(#arr)"/>
    <path d="M992 236 V260" class="arrow" marker-end="url(#arr)"/>
    <path d="M1138 236 L1122 260" class="arrow" marker-end="url(#arr)"/>
    <polygon points="830,262 1146,262 1162,287 1146,312 830,312 814,287" fill="#fbeaea" stroke="#b3261e" stroke-width="1.6"/>
    <text x="988" y="284" text-anchor="middle" style="font-size:13px;font-weight:700">인용 게이트 · FR-7</text>
    <text x="988" y="301" text-anchor="middle" class="detail muted">근거 목록 밖 URL 은 막는다 · 숫자는 코드 값만</text>
  </g>

  <!-- 정본에 쓰는 결과 (버스) -->
  <g>
    <line x1="262" y1="236" x2="262" y2="356" class="data-line"/>
    <line x1="408" y1="236" x2="408" y2="356" class="data-line"/>
    <line x1="554" y1="236" x2="554" y2="356" class="data-line"/>
    <line x1="988" y1="312" x2="988" y2="356" class="data-line"/>
    <line x1="1284" y1="236" x2="1284" y2="356" class="data-line"/>
    <line x1="1410" y1="236" x2="1410" y2="356" class="data-line"/>
    <line x1="262" y1="356" x2="1410" y2="356" class="data-line"/>
    <text x="1150" y="349" text-anchor="middle" style="font-size:11.5px;fill:#2e7d4f">정본에 쓰는 결과</text>
    <path d="M600 356 V436" class="data-line" marker-end="url(#arr-green)"/>
  </g>

  <!-- notion → Notion, archive → Releases -->
  <path d="M1450 236 V400 H1300 V436" class="ext-line" marker-end="url(#arr-purple)"/>
  <text x="1375" y="393" text-anchor="middle" style="font-size:11px;fill:#5b4a9e">Notion API</text>
  <path d="M1576 236 V436" class="arrow" marker-end="url(#arr)"/>

  <!-- data/ 정본 -->
  <g>
    <path d="M440,454 A160,14 0 0 1 760,454 V538 A160,14 0 0 1 440,538 Z" fill="#eaf6ef" stroke="#2e7d4f" stroke-width="1.6"/>
    <ellipse cx="600" cy="454" rx="160" ry="14" fill="#f4fbf7" stroke="#2e7d4f" stroke-width="1.6"/>
    <text x="600" y="492" text-anchor="middle" class="code" style="font-size:18px;font-weight:700">data/</text>
    <text x="600" y="515" text-anchor="middle" style="font-size:13px">정본 · 평문 · git 커밋</text>
    <text x="600" y="534" text-anchor="middle" class="detail muted">주간 파일은 한 번 쓰면 그대로 둔다</text>
  </g>

  <!-- Notion -->
  <g>
    <rect x="1150" y="440" width="260" height="112" rx="12" fill="#f3f0fa" stroke="#5b4a9e" stroke-width="1.6"/>
    <text x="1280" y="474" text-anchor="middle" style="font-size:17px;font-weight:700">Notion</text>
    <text x="1280" y="498" text-anchor="middle" style="font-size:13px">주간 · 카드 · 블로그 초안 DB</text>
    <text x="1280" y="518" text-anchor="middle" class="detail muted">상태가 "초안"인 페이지만 고친다</text>
    <text x="1150" y="578" class="detail">사용자가 검토 → 네이버 블로그에 직접 게시</text>
    <text x="1150" y="596" class="detail muted">파이프라인은 게시하지 않는다 (FR-16)</text>
  </g>

  <!-- GitHub Releases -->
  <g>
    <path d="M1440,454 A125,14 0 0 1 1690,454 V538 A125,14 0 0 1 1440,538 Z" fill="#f3f0fa" stroke="#5b4a9e" stroke-width="1.6"/>
    <ellipse cx="1565" cy="454" rx="125" ry="14" fill="#faf8fd" stroke="#5b4a9e" stroke-width="1.6"/>
    <text x="1565" y="492" text-anchor="middle" style="font-size:16px;font-weight:700">GitHub Releases</text>
    <text x="1565" y="513" text-anchor="middle" class="detail">근거 원문 · LLM 로그 · 전체 스냅샷</text>
    <text x="1565" y="532" text-anchor="middle" class="detail muted">git 밖 · 스냅샷은 다음 주 비교용</text>
  </g>

  <!-- Vercel -->
  <g>
    <rect x="60" y="440" width="300" height="112" rx="12" fill="#f3f0fa" stroke="#5b4a9e" stroke-width="1.6"/>
    <text x="210" y="474" text-anchor="middle" style="font-size:17px;font-weight:700">Vercel</text>
    <text x="210" y="498" text-anchor="middle" style="font-size:13px">Next.js 빌드 → 비공개 사이트</text>
    <text x="210" y="518" text-anchor="middle" class="detail muted">All Deployments + Vercel 로그인</text>
    <path d="M440 496 H364" stroke="#5b4a9e" stroke-width="1.8" fill="none" marker-end="url(#arr-purple)"/>
    <text x="401" y="487" text-anchor="middle" style="font-size:11px;fill:#5b4a9e">git push</text>
    <text x="401" y="512" text-anchor="middle" style="font-size:11px;fill:#5b4a9e">자동 재배포</text>
    <text x="60" y="578" class="detail">읽는 것: <tspan class="code">data/site/</tspan> · 카드 본문</text>
    <text x="60" y="596" class="detail muted">읽지 않는 것: <tspan class="code">data/stars/</tspan> 원시 시계열 (FR-9.2)</text>
  </g>

  <!-- 범례 -->
  <g>
    <rect x="60" y="634" width="24" height="15" rx="4" class="stage"/>
    <text x="92" y="646" class="detail">비용 0 단계</text>
    <rect x="190" y="634" width="24" height="15" rx="4" class="stage-llm"/>
    <text x="222" y="646" class="detail">LLM 단계 — 예산 계량기를 거친다</text>
    <polygon points="456,634 474,634 480,641.5 474,649 456,649 450,641.5" fill="#fbeaea" stroke="#b3261e" stroke-width="1.2"/>
    <text x="488" y="646" class="detail">코드가 강제하는 게이트</text>
    <rect x="652" y="634" width="24" height="15" rx="4" fill="#eaf6ef" stroke="#2e7d4f" stroke-width="1.2"/>
    <text x="684" y="646" class="detail">정본 (git)</text>
    <rect x="770" y="634" width="24" height="15" rx="4" fill="#f3f0fa" stroke="#5b4a9e" stroke-width="1.2"/>
    <text x="802" y="646" class="detail">외부 서비스</text>
    <rect x="900" y="634" width="24" height="15" rx="4" class="work"/>
    <text x="932" y="646" class="detail">실행마다 지워지는 작업 파일</text>
  </g>
  <text x="60" y="684" class="sub muted">LLM 을 부르는 단계는 classify · analyze · brief · blog 넷뿐이다. 예산 상한을 넘으면 LLM 단계만 멈추고, rank · export 결과는 그대로 나간다 (FR-11.2).</text>
</svg>
</body>
</html>

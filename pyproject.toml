[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startrend"
version = "0.0.1"
description = "Weekly GitHub star trends -> AI trend briefing + repository deep-dive cards"
requires-python = ">=3.12,<3.14"   # CI·잠금 파일은 3.12, 로컬은 3.13 도 (SPEC 결정 63)
dependencies = []

[tool.setuptools.packages.find]
include = ["startrend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: 실제 외부 호출 (GITHUB_TOKEN 등 필요, 기본 실행에서 제외)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

# 테스트는 엄격 모드에서 함수 주석만 면제한다. 타입 오류 자체는 그대로 잡는다
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
